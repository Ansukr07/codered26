<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/Asset%2026.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <script id="preloader-route-policy">
        window.shouldPlayPagePreloader = (page, fromPage) => {
            const normalize = (page) => {
                const value = String(page || '');
                const path = (value.startsWith('#/') ? value.slice(2) : value).split(/[?#]/)[0];
                return path.replace(/^\/+|\/+$/g, '') || 'home';
            };
            const route = normalize(page);
            const returningToTracks = route === 'tracks' && normalize(fromPage).startsWith('tracks/');
            return !returningToTracks && ['home', 'about', 'tracks', 'prizes', 'schedule', 'sponsors', 'faq', 'team'].includes(route);
        };
        const initialPreloaderPage = window.location.hash.startsWith('#/')
            ? window.location.hash.slice(2)
            : window.location.pathname;
        document.documentElement.dataset.preloader = window.shouldPlayPagePreloader(initialPreloaderPage) ? 'play' : 'skip';
    </script>
    <style>
        @font-face {
            font-family: LilGrotesk;
            src: url('/fonts/grotesk/LilGrotesk-Bold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }
    </style>
    <meta name="description"
        content="Code Red ’26 is a national 24-hour product development sprint by E-Cell BMSIT&M. Build, prove, and pitch for a ₹2,25,000+ prize pool." />
    <title>Code Red ’26 — From Idea to Impact</title>
    <link rel="preload" href="/fonts/grotesk/LilGrotesk-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            background: #ed2024;
        }
        html[data-preloader="skip"] #preloader,
        html[data-preloader="skip"] #intro-text { display: none; }

        #intro-text {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #intro-text-inner {
            padding: 0 1rem;
            text-align: center;
            color: #0a0600;
            font: 600 clamp(2.5rem, 10vw, 8rem)/1 LilGrotesk, sans-serif;
            letter-spacing: -0.02em;
        }

        .intro-char { display: inline-block; will-change: opacity; }
        #preloader .block { width: 100%; height: 100%; background: #ed2024; }
        #preloader .block.hide { animation: shadeAway 0.32s ease forwards; }

        @keyframes shadeAway {
            0% { background: #ed2024; opacity: 1; }
            40% { background: #6b0e12; opacity: 1; }
            100% { background: #6b0e12; opacity: 0; }
        }
    </style>
</head>

<body>
    <!-- Preloader Overlay -->
    <div id="preloader"></div>

    <!-- Intro text: centered over the red screen -->
    <div id="intro-text" aria-hidden="true">
        <span id="intro-text-inner">CODERED'26</span>
    </div>

    <!-- React App Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Preloader Logic -->
    <script id="preloader-controller">
        const playInitialPreloader = document.documentElement.dataset.preloader === 'play';
        if (playInitialPreloader) {
            document.documentElement.classList.add('preloader-active');
            document.body.style.overflow = 'hidden';
        }

        let mainPageVisited = false;
        function firstMainPageVisit() {
            if (mainPageVisited) return false;
            mainPageVisited = true;
            try {
                const seen = sessionStorage.getItem('CR_TAB_MEMORY');
                sessionStorage.setItem('CR_TAB_MEMORY', 'true');
                return !seen;
            } catch {
                return true;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const preloader = document.getElementById("preloader");
            let transitionVersion = 0;
            let totalBlocks = 0;
            let blocks = [];

            // Build only when a main page opens, using the current viewport.
            function buildPixelGrid() {
                const columns = window.innerWidth <= 768 ? 6 : 10;
                const squareSize = window.innerWidth / columns;
                const rows = Math.ceil(window.innerHeight / squareSize);
                totalBlocks = columns * rows;
                preloader.style.gridTemplateColumns = `repeat(${columns}, ${squareSize}px)`;
                preloader.style.gridTemplateRows = `repeat(${rows}, ${squareSize}px)`;
                preloader.replaceChildren();
                blocks = [];
                for (let i = 0; i < totalBlocks; i++) {
                    const block = document.createElement("div");
                    block.classList.add("block");
                    preloader.appendChild(block);
                    blocks.push(block);
                }
                preloader.style.background = 'transparent';
            }

            function finishPreloader() {
                preloader.style.display = 'none';
                document.getElementById('intro-text').style.display = 'none';
                document.documentElement.dataset.preloader = 'skip';
                document.documentElement.classList.remove('preloader-active');
                document.body.style.overflow = '';
                window.dispatchEvent(new Event('preloaderComplete'));
            }

            // ── Fisher-Yates shuffle ──
            function shuffle(array) {
                let currentIndex = array.length, randomIndex;
                while (currentIndex !== 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            }

            // ── Glitch a set of chars in or out ──
            function glitchChars(chars, out, duration) {
                return new Promise(resolve => {
                    chars.forEach(char => {
                        const flashes = 2 + Math.floor(Math.random() * 4);
                        const startDelay = Math.random() * duration * 0.65;
                        const flashInterval = (duration * 0.35) / flashes;
                        setTimeout(() => {
                            let step = 0;
                            const interval = setInterval(() => {
                                char.style.opacity = Math.random() < 0.5 ? '0' : '1';
                                step++;
                                if (step >= flashes) {
                                    clearInterval(interval);
                                    char.style.opacity = out ? '0' : '1';
                                }
                            }, flashInterval);
                        }, startDelay);
                    });
                    setTimeout(resolve, duration);
                });
            }

            // ── Subtle residual flickers while text is held ──
            function holdWithResidual(chars, duration) {
                return new Promise(resolve => {
                    const blinks = Math.round((duration / 1000) * 15);
                    for (let i = 0; i < blinks; i++) {
                        const at = Math.random() * duration;
                        const char = chars[Math.floor(Math.random() * chars.length)];
                        setTimeout(() => {
                            char.style.opacity = (0.1 + Math.random() * 0.4).toString();
                            setTimeout(() => { char.style.opacity = '1'; }, 20 + Math.random() * 40);
                        }, at);
                    }
                    setTimeout(resolve, duration);
                });
            }

            // ── Intro text animation (first visit only) ──
            function runIntro() {
                return new Promise(async resolve => {
                    const introText = document.getElementById('intro-text');
                    const inner = document.getElementById('intro-text-inner');

                    const text = inner.textContent;
                    inner.textContent = '';
                    const chars = [];
                    [...text].forEach(ch => {
                        const span = document.createElement('span');
                        span.className = 'intro-char';
                        span.textContent = ch;
                        span.style.opacity = '0';
                        inner.appendChild(span);
                        chars.push(span);
                    });

                    introText.style.display = 'flex';

                    // 1. Glitch IN
                    await glitchChars(chars, false, 350);

                    // 2. Hold with residual flickers
                    await holdWithResidual(chars, 600);

                    // 3. Glitch OUT
                    await glitchChars(chars, true, 220);

                    introText.style.display = 'none';
                    resolve();
                });
            }

            // ── Pixel dissolution ──
            function runDissolution(delay = 100, stagger = 8, version = transitionVersion) {
                return new Promise(resolve => {
                    const shuffledBlocks = shuffle([...blocks]);
                    setTimeout(() => {
                        shuffledBlocks.forEach((block, index) => {
                            setTimeout(() => block.classList.add('hide'), index * stagger);
                        });
                        setTimeout(() => {
                            if (version === transitionVersion) finishPreloader();
                            resolve();
                        }, (totalBlocks - 1) * stagger + 350);
                    }, delay);
                });
            }

            function revealPage(version, stagger) {
                const intro = firstMainPageVisit() ? runIntro() : Promise.resolve();
                intro.then(() => {
                    if (version === transitionVersion) return runDissolution(100, stagger, version);
                });
            }

            window.playPagePreloader = (changePage, page, fromPage) => {
                const version = ++transitionVersion;
                if (!window.shouldPlayPagePreloader(page, fromPage)) {
                    finishPreloader();
                    changePage();
                    return;
                }
                document.documentElement.dataset.preloader = 'play';
                document.documentElement.classList.add('preloader-active');
                document.body.style.overflow = 'hidden';
                document.getElementById('intro-text').style.display = 'none';
                preloader.style.display = 'grid';
                buildPixelGrid();

                requestAnimationFrame(() => {
                    if (version !== transitionVersion) return;
                    changePage();
                    requestAnimationFrame(() => {
                        if (version === transitionVersion) revealPage(version, 10);
                    });
                });
            };

            // ── Sequence: intro (if first visit) → dissolution ──
            if (playInitialPreloader) {
                buildPixelGrid();
                revealPage(++transitionVersion, 8);
            } else {
                finishPreloader();
            }
        });
    </script>
    <noscript><style>
        #preloader, #intro-text { display: none !important; }
        .anim-slide-up, .anim-slide-down, .anim-blur-reveal { opacity: 1 !important; transform: none !important; filter: none !important; }
        .faq-list, .custom-navbar { display: none !important; }
    </style></noscript>
    <noscript><nav aria-label="Site pages" style="padding: 1rem; background: #101010; color: white">
        <a href="/">Home</a> · <a href="/about">About</a> · <a href="/tracks">Tracks</a> · <a href="/prizes">Prizes</a> · <a href="/sponsors">Partners</a> · <a href="/faq">FAQ</a>
    </nav></noscript>
</body>

</html>
