<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/Asset%2026.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <style>
        @font-face {
            font-family: LilGrotesk;
            src: url('/fonts/grotesk/LilGrotesk-Bold.otf') format('opentype');
            font-weight: 600;
            font-display: swap;
        }
    </style>
    <meta name="description"
        content="Code Red ’26 is a national 24-hour product development sprint by E-Cell BMSIT&M. Build, prove, and pitch for a ₹2,00,000 prize pool." />
    <title>Code Red ’26 — From Idea to Impact</title>
    <link rel="preload" href="/fonts/grotesk/LilGrotesk-Bold.otf" as="font" type="font/otf" crossorigin />
    <style>
        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            background: #ed2024;
        }

        #intro-text {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #intro-text-inner {
            padding: 0 1rem;
            text-align: center;
            color: #0a0600;
            font: 600 clamp(2.5rem, 10vw, 8rem)/1 LilGrotesk, sans-serif;
            letter-spacing: -0.02em;
        }

        .intro-char { display: inline-block; will-change: opacity; }
        #preloader .block { width: 100%; height: 100%; background: #ed2024; }
        #preloader .block.hide { animation: shadeAway 0.4s ease forwards; }

        @keyframes shadeAway {
            0% { background: #ed2024; opacity: 1; }
            40% { background: #6b0e12; opacity: 1; }
            100% { background: #6b0e12; opacity: 0; }
        }
    </style>
</head>

<body>
    <!-- Preloader Overlay -->
    <div id="preloader"></div>

    <!-- Intro text: centered over the red screen -->
    <div id="intro-text" aria-hidden="true">
        <span id="intro-text-inner">CODERED'26</span>
    </div>

    <!-- React App Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Preloader Logic -->
    <script>
        // ── Add class so scrollbar turns red during preloader ──
        document.documentElement.classList.add('preloader-active');

        // ── Prevent scrolling while preloader is running ──
        document.body.style.overflow = 'hidden';

        document.addEventListener("DOMContentLoaded", () => {
            const preloader = document.getElementById("preloader");

            // ── Build pixel grid ──
            const isMobile = window.innerWidth <= 768;
            const columns = isMobile ? 6 : 10;
            const squareSize = preloader.offsetWidth / columns;
            const rows = Math.ceil(preloader.offsetHeight / squareSize);
            const totalBlocks = columns * rows;

            preloader.style.gridTemplateColumns = `repeat(${columns}, ${squareSize}px)`;
            preloader.style.gridTemplateRows = `repeat(${rows}, ${squareSize}px)`;

            const blocks = [];
            for (let i = 0; i < totalBlocks; i++) {
                const block = document.createElement("div");
                block.classList.add("block");
                preloader.appendChild(block);
                blocks.push(block);
            }
            // The blocks now cover the screen; let them reveal the page as they dissolve.
            preloader.style.background = 'transparent';

            // ── Fisher-Yates shuffle ──
            function shuffle(array) {
                let currentIndex = array.length, randomIndex;
                while (currentIndex !== 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            }

            // ── Pixel dissolution ──
            function runDissolution(delay = 200, stagger = 12) {
                return new Promise(resolve => {
                    const shuffledBlocks = shuffle([...blocks]);
                    setTimeout(() => {
                        shuffledBlocks.forEach((block, index) => {
                            setTimeout(() => block.classList.add('hide'), index * stagger);
                        });
                        setTimeout(() => {
                            preloader.style.display = 'none';
                            document.documentElement.classList.remove('preloader-active');
                            window.dispatchEvent(new Event('preloaderComplete'));
                            document.body.style.overflow = '';
                            resolve();
                        }, (totalBlocks - 1) * stagger + 400);
                    }, delay);
                });
            }

            let pageTransitionRunning = false;
            window.playPagePreloader = (changePage) => {
                if (pageTransitionRunning) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { changePage(); return; }
                pageTransitionRunning = true;
                document.documentElement.classList.add('preloader-active');
                document.body.style.overflow = 'hidden';
                blocks.forEach(block => block.classList.remove('hide'));
                preloader.style.display = 'grid';

                requestAnimationFrame(() => {
                    changePage();
                    requestAnimationFrame(() => {
                        runDissolution(0, 7).then(() => { pageTransitionRunning = false; });
                    });
                });
            };

            // Reveal initial HTML immediately, so the intro cannot delay useful content.
            preloader.style.display = 'none';
            document.documentElement.classList.remove('preloader-active');
            document.body.style.overflow = '';
            window.dispatchEvent(new Event('preloaderComplete'));
        });
    </script>
    <noscript><style>
        #preloader, #intro-text { display: none !important; }
        .anim-slide-up, .anim-slide-down, .anim-blur-reveal { opacity: 1 !important; transform: none !important; filter: none !important; }
        .faq-list, .custom-navbar { display: none !important; }
    </style></noscript>
    <noscript><nav aria-label="Site pages" style="padding: 1rem; background: #101010; color: white">
        <a href="/">Home</a> · <a href="/about">About</a> · <a href="/tracks">Tracks</a> · <a href="/prizes">Prizes</a> · <a href="/sponsors">Sponsors</a> · <a href="/faq">FAQ</a>
    </nav></noscript>
</body>

</html>
