<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/codered2026/codered2026/vector%20files/elements/Artboard%201.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <meta name="description" content="CODERED’ 26 — a collision of code, creativity, and curiosity. Bring your wildest idea. Let’s make it real. Hackathon details coming soon." />
    <title>CODERED’ 26 — Make a little chaos.</title>
  </head>
  <body>
    <!-- Preloader Overlay -->
    <div id="preloader"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Preloader Logic -->
    <script>
      // Add class to html so scrollbar turns red during preloader
      document.documentElement.classList.add('preloader-active');

      // Prevent scrolling while preloader is running (on body, not html)
      document.body.style.overflow = 'hidden';
      
      document.addEventListener("DOMContentLoaded", () => {
          const preloader = document.getElementById("preloader");
          
          const isMobile = window.innerWidth <= 768;
          const columns = isMobile ? 6 : 10; 
          
          const squareSize = window.innerWidth / columns;
          const rows = Math.ceil(window.innerHeight / squareSize);
          const totalBlocks = columns * rows;

          preloader.style.gridTemplateColumns = `repeat(${columns}, ${squareSize}px)`;
          preloader.style.gridTemplateRows = `repeat(${rows}, ${squareSize}px)`;

          const blocks = [];

          for (let i = 0; i < totalBlocks; i++) {
              const block = document.createElement("div");
              block.classList.add("block");
              preloader.appendChild(block);
              blocks.push(block);
          }

          function shuffle(array) {
              let currentIndex = array.length, randomIndex;
              while (currentIndex !== 0) {
                  randomIndex = Math.floor(Math.random() * currentIndex);
                  currentIndex--;
                  [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
              }
              return array;
          }

          const shuffledBlocks = shuffle([...blocks]);

          setTimeout(() => {
              shuffledBlocks.forEach((block, index) => {
                  setTimeout(() => {
                      block.classList.add("hide");
                  }, index * 25); 
              });

              const totalAnimationTime = (totalBlocks * 25) + 300; 
              setTimeout(() => {
                  preloader.style.display = "none";
                  document.documentElement.classList.remove('preloader-active');
                  document.body.style.overflow = ""; // Restore scrolling
              }, totalAnimationTime);
              
          }, 400); 
      });
    </script>
  </body>
</html>
